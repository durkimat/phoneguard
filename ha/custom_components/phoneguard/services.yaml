create_pairing:
  name: Create pairing
  description: Start pairing a phone for a child. Shows a QR code on the Phone Guard card.
  fields:
    child: {required: true, example: "her", selector: {text: {}}}
    name: {required: false, example: "Phone", selector: {text: {}}}
    person: {required: false, example: "Her", selector: {text: {}}}
confirm_pairing:
  name: Confirm pairing
  description: Confirm the 4-digit number shown on the phone.
  fields:
    child: {required: true, selector: {text: {}}}
    sas: {required: true, selector: {text: {}}}
boost:
  name: Boost
  description: Give extra time in a mode. Pressing again adds more.
  fields:
    child: {required: true, selector: {text: {}}}
    mode: {required: false, default: day, selector: {text: {}}}
    minutes: {required: false, default: 15, selector: {number: {min: 1, max: 180}}}
    extend: {required: false, default: true, selector: {boolean: {}}}
cancel_boost:
  name: Cancel boost
  fields:
    child: {required: true, selector: {text: {}}}
set_holiday:
  name: Set holiday
  description: Turn School into Day between two dates. Leave both empty to clear.
  fields:
    child: {required: true, selector: {text: {}}}
    from: {required: false, selector: {date: {}}}
    until: {required: false, selector: {date: {}}}
set_app_mode:
  name: Set app in mode
  fields:
    child: {required: true, selector: {text: {}}}
    package: {required: true, selector: {text: {}}}
    mode: {required: true, selector: {text: {}}}
    allowed: {required: true, selector: {boolean: {}}}
approve_app:
  name: Approve app
  fields:
    child: {required: true, selector: {text: {}}}
    package: {required: true, selector: {text: {}}}
    modes: {required: true, example: "[day, night]", selector: {object: {}}}
dismiss_app:
  name: Dismiss app
  description: Keep a new app hidden everywhere and stop listing it as new.
  fields:
    child: {required: true, selector: {text: {}}}
    package: {required: true, selector: {text: {}}}
set_child:
  name: Set child settings
  description: Patch name, tz, base, notify, modes, week, protect_extra, unprotect, restrictions.
  fields:
    child: {required: true, selector: {text: {}}}
    config: {required: true, selector: {object: {}}}
set_options:
  name: Set options for all phones
  description: Settings shared by every phone, such as the Spotify Client ID.
  fields:
    spotify_client_id: {required: false, selector: {text: {}}}
nudge:
  name: Nudge phone
  description: Ask the phone to sync now.
  fields:
    child: {required: true, selector: {text: {}}}
release:
  name: Release phone
  description: Tell the phone to stop being managed (removes device owner) on its next sync.
  fields:
    child: {required: true, selector: {text: {}}}
forget:
  name: Forget phone
  description: Remove a phone and any pending pairing from Home Assistant.
  fields:
    child: {required: true, selector: {text: {}}}
remove_child:
  name: Remove device
  description: Delete a guarded device entirely (timetable, apps, pairing and usage history).
  fields:
    child: {required: true, selector: {text: {}}}
copy_settings:
  name: Copy settings to another device
  description: Copy the timetable and other settings from one guarded device to another. App lists are never copied.
  fields:
    child: {required: true, selector: {text: {}}}
    to: {required: true, selector: {text: {}}}
    parts: {required: true, example: "[timetable, holiday, restrictions, mode_options]", selector: {object: {}}}
rename_child:
  name: Rename a device's id
  description: Change the id used in the sensor name (sensor.phoneguard_<id>). Settings, pairing and history are kept.
  fields:
    child: {required: true, selector: {text: {}}}
    new_child: {required: true, selector: {text: {}}}
set_override:
  name: Force a mode
  description: Hold one mode regardless of the timetable. Use auto to go back to the timetable.
  fields:
    child: {required: true, selector: {text: {}}}
    mode: {required: true, example: school, selector: {text: {}}}

spotify_signout:
  name: Sign out of Spotify
  description: Forget the Spotify sign-in held for this phone (the phone signs out at its next check-in).
  fields:
    child:
      name: Device
      required: true
      selector:
        text:

set_mode_all:
  name: Allow every app in a mode
  description: Tick (or untick) every app the phone has reported in one mode's column.
  fields:
    child: {required: true, selector: {text: {}}}
    mode: {required: true, example: day, selector: {text: {}}}
    allowed: {required: true, selector: {boolean: {}}}
