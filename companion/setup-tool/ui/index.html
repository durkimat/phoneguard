<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phone Guard setup</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#1c1b1a;--mut:#6b6a66;--line:#d9d7d0;--acc:#185fa5;--card:#f6f5f1;--bad:#a32d2d;--ok:#3b6d11}
@media(prefers-color-scheme:dark){:root{--bg:#1c1b1a;--fg:#ecebe6;--mut:#a3a199;--line:#3a3935;--acc:#85b7eb;--card:#262522;--bad:#f09595;--ok:#97c459}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,sans-serif}main{max-width:40rem;margin:0 auto;padding:20px 16px}
h1{font-size:24px;font-weight:500}h2{font-size:18px;font-weight:500;margin-top:28px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
.mut{color:var(--mut);font-size:14px}.bad{color:var(--bad)}.ok{color:var(--ok)}
button,a.btn{font:inherit;border:1px solid var(--acc);background:var(--acc);color:var(--bg);border-radius:8px;padding:10px 18px;min-height:44px;cursor:pointer;text-decoration:none;display:inline-block}
input{font:inherit;width:100%;box-sizing:border-box;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;min-height:44px}
ul{list-style:none;padding:0}li{padding:4px 0}li.done::before{content:"\2713  ";color:var(--ok)}li.doing::before{content:"\2026  ";color:var(--acc)}li.failed::before{content:"\2717  ";color:var(--bad)}li.todo{color:var(--mut)}li.todo::before{content:"\2022  "}
.steps{display:flex;gap:4px;margin:12px 0 4px;padding:0;list-style:none}.steps li{flex:1;min-width:0;overflow-wrap:anywhere;text-align:center;font-size:11px;color:var(--mut);border-top:4px solid var(--line);padding-top:4px}.steps li.cur{color:var(--fg);border-color:var(--acc);font-weight:500}.steps li.past{border-color:var(--ok)}.steps li.skip{border-color:var(--mut)}
button.sec,a.sec{background:var(--bg);color:var(--fg);border-color:var(--line)}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}.copy{display:flex;gap:8px;align-items:center;margin:6px 0}.copy code{flex:1;word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:13px ui-monospace,monospace}.copy button{min-height:36px;padding:4px 12px}
button:disabled{opacity:.5;cursor:default}.warn{border-color:var(--bad)}.key{font:20px ui-monospace,monospace;word-break:break-all;padding:10px;border:2px dashed var(--bad);border-radius:8px;margin:8px 0}input.digits{width:8em;font-size:24px;letter-spacing:.2em;text-align:center}
.qr svg{width:220px;height:220px;background:#fff;border-radius:8px}.code{font:28px ui-monospace,monospace;letter-spacing:.08em}.grid{display:flex;gap:24px;flex-wrap:wrap}.link{word-break:break-all;font:13px ui-monospace,monospace}
</style></head><body><main data-session="__SESSION__"><h1>Phone Guard family setup</h1><ol class="steps" id="steps" aria-label="Progress"></ol><p class="mut" id="stepText"></p><div id="v"></div></main><script src="/app.js"></script></body></html>
